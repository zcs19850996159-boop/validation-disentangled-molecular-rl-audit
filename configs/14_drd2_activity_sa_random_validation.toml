# DRD2 activity-vs-SA shuffled-validation control.
#
# Same training reward and budget as 13_drd2_activity_sa_dynamic.toml. The
# random-control behavior is selected by REINVENT_VALIDATION_COMMAND, not by
# this TOML file.

run_type = "staged_learning"
device = "cuda:0"
tb_logdir = "tb_logs_drd2_activity_sa_random_validation"
json_out_config = "_drd2_activity_sa_random_validation.json"

[parameters]
summary_csv_prefix = "drd2_activity_sa_random_validation"
use_checkpoint = false
purge_memories = false

prior_file = "priors/reinvent.prior"
agent_file = "priors/reinvent.prior"

batch_size = 64
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4
penalty_multiplier = 0.5

[[stage]]
chkpt_file = "drd2_activity_sa_random_validation_stage1.chkpt"

termination = "simple"
max_score = 0.85
min_steps = 50
max_steps = 300

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]

[[stage.scoring.component.ExternalProcess.endpoint]]
name = "DRD2_activity"
weight = 0.50
params.executable = "/root/miniconda3/envs/reinvent4/bin/python"
params.args = "scripts/score_qsar_json.py --model qsar_models/DRD2/reward_rf.pkl --property DRD2_activity"
params.property = "DRD2_activity"

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]

[[stage.scoring.component.ExternalProcess.endpoint]]
name = "SA_score"
weight = 0.50
params.executable = "/root/miniconda3/envs/reinvent4/bin/python"
params.args = "scripts/score_rdkit_property_json.py --property SA_score --metric sa_proxy"
params.property = "SA_score"
