# DRD2 activity-vs-SA dynamic-weight pilot.
#
# Training reward:
# - DRD2_activity: RandomForest QSAR reward model via ExternalProcess.
# - SA_score: cheap RDKit complexity proxy via ExternalProcess.
#
# Controller validation should be provided separately with:
#   REINVENT_VALIDATION_COMMAND="/root/miniconda3/envs/reinvent4/bin/python scripts/validate_qsar.py --input {input} --output {output} --model qsar_models/DRD2/validation_svm.pkl --component-names 'DRD2_activity,SA_score'"

run_type = "staged_learning"
device = "cuda:0"
tb_logdir = "tb_logs_drd2_activity_sa_dynamic"
json_out_config = "_drd2_activity_sa_dynamic.json"

[parameters]
summary_csv_prefix = "drd2_activity_sa_dynamic"
use_checkpoint = false
purge_memories = false

prior_file = "priors/reinvent.prior"
agent_file = "priors/reinvent.prior"

batch_size = 64
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4
penalty_multiplier = 0.5

[[stage]]
chkpt_file = "drd2_activity_sa_dynamic_stage1.chkpt"

termination = "simple"
max_score = 0.85
min_steps = 50
max_steps = 300

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]

[[stage.scoring.component.ExternalProcess.endpoint]]
name = "DRD2_activity"
weight = 0.50
params.executable = "/root/miniconda3/envs/reinvent4/bin/python"
params.args = "scripts/score_qsar_json.py --model qsar_models/DRD2/reward_rf.pkl --property DRD2_activity"
params.property = "DRD2_activity"

[[stage.scoring.component]]
[stage.scoring.component.ExternalProcess]

[[stage.scoring.component.ExternalProcess.endpoint]]
name = "SA_score"
weight = 0.50
params.executable = "/root/miniconda3/envs/reinvent4/bin/python"
params.args = "scripts/score_rdkit_property_json.py --property SA_score --metric sa_proxy"
params.property = "SA_score"
